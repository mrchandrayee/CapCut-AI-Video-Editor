name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS (Apple Silicon + Intel universal DMG) ───────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build macOS DMG
        run: npx electron-builder --mac --arm64 --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          name: "DRISHQAN ${{ github.ref_name }}"
          body: |
            ## DRISHQAN ${{ github.ref_name }}

> **Drishya + Creation** — Visual Creation Local AI Video Studio

            ### 🚀 Downloads
            | Platform | File | Architecture |
            |---|---|---|
            | 🍎 macOS | `DRISHQAN-${{ github.ref_name }}-mac-arm64.dmg` | Apple Silicon (M1/M2/M3/M4) |
            | 🍎 macOS | `DRISHQAN-${{ github.ref_name }}-mac-x64.dmg` | Intel Macs |
            | 🪟 Windows | `DRISHQAN-${{ github.ref_name }}-win-x64.exe` | Windows 10/11 (64-bit) |
            | 🐧 Linux | `DRISHQAN-${{ github.ref_name }}-linux-amd64.deb` | Ubuntu / Debian |

            ---

            ### 🍎 macOS Fix: Gatekeeper & 1-Click Run Command
            Apple Gatekeeper blocks unsigned open-source applications on macOS Sequoia/Sonoma.

            **To install and launch DRISHQAN in 1 second without any errors, paste this in Terminal:**
            ```bash
            # Copy app from DMG to Applications
            cp -R "/Volumes/DRISHQAN"*/DRISHQAN.app /Applications/ 2>/dev/null || true

            # Remove Apple Gatekeeper quarantine flag
            xattr -cr /Applications/DRISHQAN.app

            # Launch DRISHQAN
            open /Applications/DRISHQAN.app
            ```

            **Single-line command:**
            ```bash
            xattr -cr /Applications/DRISHQAN.app && open /Applications/DRISHQAN.app
            ```

            ---

            ### Requirements
            - Python 3.10+
            - FFmpeg (`brew install ffmpeg` on macOS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows (NSIS installer) ──────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/*.exe
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux (.deb package) ─────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3-dev libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev \
            libgbm-dev libpango1.0-dev libasound2-dev \
            rpm fakeroot

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Linux .deb
        run: npx electron-builder --linux deb --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
